name: Update Strava Data

on:
  schedule:
    # Run every day at consistently at 3 AM UTC (early morning)
    - cron: '0 3 * * *'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: update-public-data
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows github actions to push code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Strava Fetch Script
        run: node scripts/fetch-strava.js
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit and Push changes
        run: |
          bash scripts/commit-data.sh public/strava-data.json 'chore(strava): auto-update daily activities'
